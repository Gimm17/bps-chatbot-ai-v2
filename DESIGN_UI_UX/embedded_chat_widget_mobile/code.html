<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>BPS AI Assistant - Mobile Widget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@650;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "brand-green-deep": "#527D17",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ffb874",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed": "#001e2e",
                        "surface-dim": "#ccdbf3",
                        "primary-fixed-dim": "#83cfff",
                        "on-background": "#0d1c2e",
                        "brand-blue-deep": "#005F85",
                        "outline-variant": "#bfc8d0",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#004c6c",
                        "bg-main": "#F8FAFC",
                        "primary": "#005d83",
                        "on-error": "#ffffff",
                        "brand-orange-deep": "#9A5600",
                        "brand-blue-vibrant": "#00ADEF",
                        "secondary-fixed": "#ffdcbf",
                        "surface": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "background": "#f8f9ff",
                        "surface-blue": "#E8F8FE",
                        "primary-container": "#0077a6",
                        "secondary-container": "#fd9923",
                        "on-secondary-container": "#663800",
                        "tertiary-fixed-dim": "#9cd84e",
                        "secondary": "#8c4f00",
                        "tertiary-container": "#4e7c00",
                        "tertiary": "#3c6100",
                        "surface-container-high": "#dce9ff",
                        "surface-tint": "#00658e",
                        "on-secondary-fixed": "#2d1600",
                        "on-secondary": "#ffffff",
                        "border-default": "#E2E8F0",
                        "inverse-surface": "#233144",
                        "surface-variant": "#d5e3fc",
                        "surface-green": "#F2F9E9",
                        "on-primary-container": "#ebf5ff",
                        "on-surface-variant": "#3f484f",
                        "inverse-on-surface": "#eaf1ff",
                        "inverse-primary": "#83cfff",
                        "on-tertiary-fixed-variant": "#304f00",
                        "primary-fixed": "#c7e7ff",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#d5e3fc",
                        "on-surface": "#0d1c2e",
                        "surface-bright": "#f8f9ff",
                        "error": "#ba1a1a",
                        "surface-orange": "#FFF5E8",
                        "on-secondary-fixed-variant": "#6b3b00",
                        "surface-container": "#e6eeff",
                        "on-tertiary-container": "#e0ffb4",
                        "tertiary-fixed": "#b7f567",
                        "outline": "#6f787f",
                        "surface-error": "#FEF3F2",
                        "on-tertiary-fixed": "#102000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1000px",
                        "lg": "24px",
                        "xs": "8px",
                        "reading-max": "820px",
                        "md": "16px",
                        "base": "4px",
                        "xl": "32px",
                        "sm": "12px",
                        "touch": "44px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "metadata": ["Inter"],
                        "body-main": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-medium": ["Inter"],
                        "section-title": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "metadata": ["12px", { "lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "body-main": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "1.25", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-medium": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "section-title": ["22px", { "lineHeight": "1.4", "fontWeight": "650" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Mobile height fix for browser chrome */
        .h-screen-dvh {
            height: 100vh;
            height: 100dvh;
        }
    </style>
</head>
<body class="bg-bg-main text-on-surface font-body-main antialiased h-screen-dvh overflow-hidden flex flex-col md:hidden">
<!-- Top App Bar / Header -->
<header class="flex justify-between items-center h-16 px-md w-full bg-surface border-b border-border-default shrink-0 z-10 shadow-sm relative">
<div class="flex items-center gap-sm">
<button aria-label="Back" class="w-touch h-touch flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-section-title text-section-title text-primary tracking-tight">BPS AI Assistant</h1>
</div>
<button aria-label="Close widget" class="w-touch h-touch flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Main Content Area (Scrollable) -->
<main class="flex-1 overflow-y-auto px-md py-lg flex flex-col items-center justify-start gap-lg w-full relative">
<!-- Welcome State (Centered) -->
<div class="w-full max-w-sm flex flex-col items-center text-center mt-xl mb-md">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-md border-2 border-primary-container shadow-sm">
<span class="material-symbols-outlined fill text-primary text-4xl">robot_2</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">How can I help you?</h2>
<p class="font-body-main text-body-main text-on-surface-variant mb-lg px-sm">Ask me about Indonesia's census data, economic indicators, or publication search.</p>
<!-- Stacked Suggestions -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full flex items-center justify-between p-md rounded-xl bg-surface-container-lowest border border-border-default hover:bg-surface-container-low transition-colors shadow-sm text-left">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-blue flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-brand-blue-deep text-sm">trending_up</span>
</div>
<span class="font-label-medium text-label-medium text-on-surface">Latest GDP Growth Rate</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-md rounded-xl bg-surface-container-lowest border border-border-default hover:bg-surface-container-low transition-colors shadow-sm text-left">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-green flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-brand-green-deep text-sm">group</span>
</div>
<span class="font-label-medium text-label-medium text-on-surface">Population Density by Province</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-md rounded-xl bg-surface-container-lowest border border-border-default hover:bg-surface-container-low transition-colors shadow-sm text-left">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-orange flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-brand-orange-deep text-sm">shopping_cart</span>
</div>
<span class="font-label-medium text-label-medium text-on-surface">Monthly Inflation Data</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</div>
</main>
<!-- Sticky Composer -->
<footer class="w-full bg-surface-container-lowest border-t border-border-default p-md pb-6 shrink-0 shadow-[0_-4px_16px_rgba(15,23,42,0.05)]">
<div class="flex items-end gap-sm w-full max-w-sm mx-auto">
<div class="flex-1 bg-surface-container-low rounded-xl border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all relative shadow-sm">
<textarea aria-label="Message input" class="w-full bg-transparent border-none rounded-xl py-md pl-md pr-12 font-body-main text-body-main text-on-surface placeholder-on-surface-variant resize-none focus:ring-0 max-h-32" placeholder="Ask about statistics..." rows="1" style="height:58px;overflow-y:hidden;"></textarea>
<button aria-label="Microphone" class="absolute right-2 bottom-2 w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
<button aria-label="Send message" class="w-touch h-touch flex items-center justify-center rounded-xl bg-primary-container text-on-primary shadow-sm hover:bg-surface-tint transition-colors shrink-0">
<span class="material-symbols-outlined">send</span>
</button>
</div>
<div class="w-full text-center mt-xs">
<span class="font-metadata text-metadata text-outline">BPS Assistant can make mistakes. Verify important data.</span>
</div>
</footer>
<script>
        // Simple auto-resize for textarea
        const tx = document.getElementsByTagName("textarea");
        for (let i = 0; i < tx.length; i++) {
            tx[i].setAttribute("style", "height:" + (tx[i].scrollHeight) + "px;overflow-y:hidden;");
            tx[i].addEventListener("input", OnInput, false);
        }
        function OnInput() {
            this.style.height = 0;
            this.style.height = (this.scrollHeight) + "px";
        }
    </script>


</body></html>
