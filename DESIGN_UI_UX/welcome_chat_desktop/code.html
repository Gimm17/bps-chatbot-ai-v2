<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BPS AI Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary-container": "#fd9923",
                        "secondary-fixed-dim": "#ffb874",
                        "tertiary": "#3c6100",
                        "tertiary-fixed-dim": "#9cd84e",
                        "on-tertiary-fixed": "#102000",
                        "surface-dim": "#ccdbf3",
                        "error": "#ba1a1a",

                        "outline": "#6f787f",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1000px",
                        "base": "4px",

<body class="bg-surface-bright text-on-surface font-body-main text-body-main min-h-screen flex flex-col">
<!-- Header -->
<header class="w-full flex justify-between items-center h-16 px-lg max-w-container-max mx-auto bg-surface border-b border-border-default z-10 sticky top-0">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
<div class="flex flex-col justify-center">
<h1 class="font-section-title text-section-title text-primary tracking-tight leading-none">BPS AI Assistant</h1>
<span class="font-metadata text-metadata text-on-surface-variant">Asisten Statistik Publik</span>
</div>
</div>
<div class="flex items-center gap-md">
<nav class="hidden md:flex gap-md">
<a class="font-label-medium text-label-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Tentang</a>
<a class="font-label-medium text-label-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Bantuan</a>
</nav>
<span class="bg-surface-blue text-brand-blue-deep font-metadata text-metadata px-sm py-base rounded-full border border-primary-fixed border-opacity-50">Demo</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-md md:p-xl w-full max-w-reading-max mx-auto relative">
<div class="flex flex-col items-center text-center max-w-2xl mb-12">
<!-- AI Avatar -->
<div class="w-20 h-20 bg-surface-container-low rounded-xl flex items-center justify-center mb-6 shadow-[0_8px_24px_rgba(15,23,42,0.05)] border border-surface-container border-opacity-50">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1; font-size: 40px;">smart_toy</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Halo, ada yang bisa saya bantu?</h2>
<p class="font-body-main text-body-main text-on-surface-variant">Tanyakan data, istilah statistik, publikasi, metodologi, atau informasi layanan BPS.</p>
</div>
<!-- Suggested Questions Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm w-full max-w-3xl mb-xl">
<button class="bg-surface-container-lowest border border-border-default rounded-xl p-md text-left hover:bg-surface-container-low transition-colors duration-200 group">
<p class="font-label-bold text-label-bold text-on-surface group-hover:text-primary transition-colors">Apa itu inflasi?</p>
<p class="font-metadata text-metadata text-on-surface-variant mt-base">Penjelasan ringkas konsep inflasi.</p>
</button>
<button class="bg-surface-container-lowest border border-border-default rounded-xl p-md text-left hover:bg-surface-container-low transition-colors duration-200 group">
<p class="font-label-bold text-label-bold text-on-surface group-hover:text-primary transition-colors">Apa itu PDRB?</p>
<p class="font-metadata text-metadata text-on-surface-variant mt-base">Definisi dan komponen PDRB daerah.</p>
</button>
<button class="bg-surface-container-lowest border border-border-default rounded-xl p-md text-left hover:bg-surface-container-low transition-colors duration-200 group">
<p class="font-label-bold text-label-bold text-on-surface group-hover:text-primary transition-colors">Bagaimana mencari publikasi BPS?</p>
<p class="font-metadata text-metadata text-on-surface-variant mt-base">Panduan akses direktori publikasi.</p>
</button>
<button class="bg-surface-container-lowest border border-border-default rounded-xl p-md text-left hover:bg-surface-container-low transition-colors duration-200 group">
<p class="font-label-bold text-label-bold text-on-surface group-hover:text-primary transition-colors">Di mana saya bisa menemukan data penduduk?</p>
<p class="font-metadata text-metadata text-on-surface-variant mt-base">Arahkan ke Sensus Penduduk terbaru.</p>
</button>
</div>
<!-- Fixed Chat Composer Wrapper to stick to bottom of reading view -->
<div class="w-full max-w-reading-max mt-auto flex flex-col gap-sm pb-xl">
<div class="relative w-full bg-surface-container-lowest rounded-xl shadow-[0_8px_24px_rgba(15,23,42,0.08)] border border-border-default flex items-end p-xs">
<button class="p-sm text-on-surface-variant hover:text-primary transition-colors rounded-lg flex-shrink-0">
<span class="material-symbols-outlined">attach_file</span>
</button>
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none font-body-main text-body-main text-on-surface placeholder-on-surface-variant py-sm px-sm max-h-32 min-h-[48px]" placeholder="Tanyakan sesuatu tentang BPS..." rows="1"></textarea>
<button class="bg-primary-container text-on-primary-container p-sm rounded-lg flex-shrink-0 hover:opacity-90 transition-opacity ml-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
<p class="font-metadata text-metadata text-on-surface-variant text-center opacity-80">BPS AI dapat melakukan kesalahan. Verifikasi informasi melalui sumber yang ditampilkan.</p>
</div>
</main>
</body></html>
