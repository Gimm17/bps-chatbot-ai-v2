<body class="bg-bg-main text-on-surface antialiased h-screen flex flex-col md:hidden">
<!-- TopNavBar (Mobile Anchor) -->
<header class="bg-surface docked full-width top-0 border-b border-border-default flex justify-between items-center h-16 px-md w-full z-10 shrink-0">
<div class="flex items-center gap-sm">
<button aria-label="Back" class="text-on-surface-variant p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary font-label-bold">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
<h1 class="font-label-bold text-label-bold text-on-surface">BPS AI Assistant</h1>
</div>
</div>
<div class="flex gap-xs">
<button aria-label="History" class="text-on-surface-variant p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">history</span>
</button>
<button aria-label="More options" class="text-on-surface-variant p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto p-md space-y-lg flex flex-col pb-32">
<!-- User Message -->
<div class="flex justify-end w-full">
<div class="bg-primary-fixed text-on-primary-fixed-variant rounded-xl rounded-tr-none p-md max-w-[85%] shadow-sm">
<p class="font-body-main text-body-main">Berapa jumlah penduduk?</p>
</div>
</div>
<!-- Assistant Message (Clarification Required) -->
<div class="flex gap-sm w-full items-start">
<div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-on-primary mt-1 shadow-sm">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
<div class="flex-1 space-y-md">
<!-- Main Clarification Card -->
<div class="bg-surface-blue border border-primary-fixed-dim rounded-xl rounded-tl-none p-md shadow-sm">
<div class="flex items-start gap-xs mb-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-main text-body-main text-on-surface">
                            Saya perlu sedikit informasi tambahan untuk memberikan data yang akurat.
                        </p>
</div>
<p class="font-label-bold text-label-bold text-on-surface mt-sm">
                        Wilayah dan periode tahun mana yang Anda maksud?
                    </p>
<!-- Suggestion Chips -->
<div class="mt-md flex flex-wrap gap-xs">
<button class="bg-surface border border-outline-variant hover:bg-surface-variant hover:border-primary transition-colors rounded-full px-sm py-xs flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary">public</span>
<span class="font-label-medium text-label-medium text-on-surface-variant">Seluruh Indonesia</span>
</button>
<button class="bg-surface border border-outline-variant hover:bg-surface-variant hover:border-primary transition-colors rounded-full px-sm py-xs flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary">map</span>
<span class="font-label-medium text-label-medium text-on-surface-variant">Per Provinsi</span>
</button>
<button class="bg-surface border border-outline-variant hover:bg-surface-variant hover:border-primary transition-colors rounded-full px-sm py-xs flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary">calendar_today</span>
<span class="font-label-medium text-label-medium text-on-surface-variant">Tahun 2023</span>
</button>
<button class="bg-surface border border-outline-variant hover:bg-surface-variant hover:border-primary transition-colors rounded-full px-sm py-xs flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary">calendar_month</span>
<span class="font-label-medium text-label-medium text-on-surface-variant">Tahun 2024</span>
</button>
</div>
</div>
</div>
</div>
</main>
<!-- Sticky Chat Composer -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-border-default p-md pt-sm z-20 pb-6">
<div class="bg-surface-container-lowest border border-border-default rounded-xl shadow-md p-2 flex items-end mb-xs">
<button aria-label="Attach file" class="p-2 text-on-surface-variant hover:text-primary transition-colors rounded-full">
<span class="material-symbols-outlined">attach_file</span>
</button>

<button aria-label="Send message" class="p-2 bg-primary text-on-primary rounded-lg hover:bg-brand-blue-deep transition-colors ml-2 shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
<p class="text-center font-metadata text-metadata text-on-surface-variant opacity-70">
            BPS AI dapat membuat kesalahan. Periksa informasi penting.
        </p>
</div>
