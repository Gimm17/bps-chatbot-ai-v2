<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BPS AI Assistant - Embedded Widget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@650;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "brand-green-deep": "#527D17",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ffb874",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed": "#001e2e",
                        "surface-dim": "#ccdbf3",
                        "primary-fixed-dim": "#83cfff",
                        "on-background": "#0d1c2e",
                        "brand-blue-deep": "#005F85",
                        "outline-variant": "#bfc8d0",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#004c6c",
                        "bg-main": "#F8FAFC",
                        "primary": "#005d83",
                        "on-error": "#ffffff",
                        "brand-orange-deep": "#9A5600",
                        "brand-blue-vibrant": "#00ADEF",
                        "secondary-fixed": "#ffdcbf",
                        "surface": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "background": "#f8f9ff",
                        "surface-blue": "#E8F8FE",
                        "primary-container": "#0077a6",
                        "secondary-container": "#fd9923",
                        "on-secondary-container": "#663800",
                        "tertiary-fixed-dim": "#9cd84e",
                        "secondary": "#8c4f00",
                        "tertiary-container": "#4e7c00",
                        "tertiary": "#3c6100",
                        "surface-container-high": "#dce9ff",
                        "surface-tint": "#00658e",
                        "on-secondary-fixed": "#2d1600",
                        "on-secondary": "#ffffff",
                        "border-default": "#E2E8F0",
                        "inverse-surface": "#233144",
                        "surface-variant": "#d5e3fc",
                        "surface-green": "#F2F9E9",
                        "on-primary-container": "#ebf5ff",
                        "on-surface-variant": "#3f484f",
                        "inverse-on-surface": "#eaf1ff",
                        "inverse-primary": "#83cfff",
                        "on-tertiary-fixed-variant": "#304f00",
                        "primary-fixed": "#c7e7ff",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#d5e3fc",
                        "on-surface": "#0d1c2e",
                        "surface-bright": "#f8f9ff",
                        "error": "#ba1a1a",
                        "surface-orange": "#FFF5E8",
                        "on-secondary-fixed-variant": "#6b3b00",
                        "surface-container": "#e6eeff",
                        "on-tertiary-container": "#e0ffb4",
                        "tertiary-fixed": "#b7f567",
                        "outline": "#6f787f",
                        "surface-error": "#FEF3F2",
                        "on-tertiary-fixed": "#102000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem"
                    },
                    "spacing": {
                        "container-max": "1000px",
                        "lg": "24px",
                        "xs": "8px",
                        "reading-max": "820px",
                        "md": "16px",
                        "base": "4px",
                        "xl": "32px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "metadata": ["Inter"],
                        "body-main": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-medium": ["Inter"],
                        "section-title": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "metadata": ["12px", { "lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "body-main": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "1.25", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-medium": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "section-title": ["22px", { "lineHeight": "1.4", "fontWeight": "650" }]
                    },
                    boxShadow: {
                        'diffused': '0 8px 24px rgba(15, 23, 42, 0.05)',
                        'diffused-sm': '0 1px 2px rgba(15, 23, 42, 0.05)',
                        'widget': '0 12px 32px rgba(15, 23, 42, 0.1), 0 4px 12px rgba(15, 23, 42, 0.05)'
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Widget Entry Animation */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        #bps-widget-container {
            animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: bottom right;
        }
        
        /* Custom Scrollbar */
        .widget-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .widget-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .widget-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen font-body-main text-on-surface relative overflow-hidden">
<!-- Mock Background Content to simulate embedded nature -->
<div class="max-w-container-max mx-auto p-xl opacity-30 select-none pointer-events-none">
<div class="h-16 w-48 bg-surface-variant rounded-lg mb-xl"></div>
<div class="h-8 w-3/4 bg-surface-variant rounded mb-md"></div>
<div class="h-4 w-full bg-surface-variant rounded mb-sm"></div>
<div class="h-4 w-5/6 bg-surface-variant rounded mb-xl"></div>
<div class="grid grid-cols-3 gap-lg mb-xl">
<div class="h-48 bg-surface-variant rounded-xl"></div>
<div class="h-48 bg-surface-variant rounded-xl"></div>
<div class="h-48 bg-surface-variant rounded-xl"></div>
</div>
<div class="h-8 w-1/2 bg-surface-variant rounded mb-md"></div>
<div class="h-4 w-full bg-surface-variant rounded mb-sm"></div>
<div class="h-4 w-full bg-surface-variant rounded mb-sm"></div>
<div class="h-4 w-2/3 bg-surface-variant rounded"></div>
</div>
<!-- WIDGET OVERLAY SYSTEM -->
<div class="fixed bottom-lg right-lg lg:right-xl lg:bottom-xl z-50 flex flex-col items-end">
<!-- Main Chat Window (Hidden by default in a real implementation, shown here for design) -->
<div class="w-[380px] sm:w-[400px] h-[600px] max-h-[80vh] bg-surface-container-lowest rounded-2xl shadow-widget flex flex-col border border-border-default overflow-hidden mb-md" id="bps-widget-container">
<!-- Widget Header -->
<div class="flex items-center justify-between p-md border-b border-border-default bg-surface-container-lowest shrink-0">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[18px]">assistant</span>
</div>
<div>
<h2 class="font-label-bold text-label-bold text-on-surface">BPS AI Assistant</h2>
<div class="flex items-center gap-1 mt-0.5">
<div class="w-1.5 h-1.5 rounded-full bg-brand-green-deep"></div>
<span class="font-metadata text-metadata text-on-surface-variant">Online</span>
</div>
</div>
</div>
<div class="flex items-center gap-1">
<button aria-label="Minimize widget" class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors" onclick="toggleWidget()">
<span class="material-symbols-outlined text-[20px]">minimize</span>
</button>
<button aria-label="Close widget" class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors" onclick="toggleWidget()">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Widget Body (Scrollable) -->
<div class="flex-1 bg-bg-main overflow-y-auto widget-scroll p-md flex flex-col relative">
<!-- Welcome State Container -->
<div class="flex flex-col items-center justify-center py-xl text-center flex-1">
<div class="w-16 h-16 rounded-2xl bg-surface-container-low border border-border-default flex items-center justify-center mb-md shadow-diffused-sm relative">
<div class="absolute -top-1 -right-1 w-3 h-3 bg-brand-green-deep border-2 border-surface-container-lowest rounded-full"></div>
<span class="material-symbols-outlined text-[32px] text-primary fill">robot_2</span>
</div>
<h3 class="font-section-title text-section-title text-on-surface mb-xs">Halo! Ada yang bisa saya bantu?</h3>
<p class="font-body-main text-body-main text-on-surface-variant mb-xl max-w-[280px]">Tanyakan informasi statistik atau layanan BPS.</p>
<!-- Suggested Questions (Stacked) -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full text-left p-sm bg-surface-container-lowest border border-border-default rounded-lg hover:border-primary-fixed-dim hover:bg-surface-container-low transition-all group flex items-center justify-between">
<span class="font-label-medium text-label-medium text-on-surface group-hover:text-primary">Apa itu inflasi?</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</button>
<button class="w-full text-left p-sm bg-surface-container-lowest border border-border-default rounded-lg hover:border-primary-fixed-dim hover:bg-surface-container-low transition-all group flex items-center justify-between">
<span class="font-label-medium text-label-medium text-on-surface group-hover:text-primary">Data penduduk terbaru</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</button>
<button class="w-full text-left p-sm bg-surface-container-lowest border border-border-default rounded-lg hover:border-primary-fixed-dim hover:bg-surface-container-low transition-all group flex items-center justify-between">
<span class="font-label-medium text-label-medium text-on-surface group-hover:text-primary">Cari publikasi</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Widget Composer (Sticky Bottom) -->
<div class="p-md bg-surface-container-lowest border-t border-border-default shrink-0">
<div class="relative flex items-end bg-surface-container-low rounded-xl border border-border-default focus-within:border-brand-blue-vibrant focus-within:ring-1 focus-within:ring-brand-blue-vibrant transition-all shadow-diffused-sm">
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none py-sm pl-sm pr-12 font-body-main text-body-main text-on-surface placeholder-on-surface-variant min-h-[44px] max-h-[120px] widget-scroll" oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 120) + 'px'" placeholder="Tanyakan sesuatu..." rows="1"></textarea>
<div class="absolute right-xs bottom-xs flex">
<button aria-label="Kirim pesan" class="w-8 h-8 flex items-center justify-center rounded-lg bg-primary text-on-primary hover:bg-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</div>
<!-- Disclaimer -->
<div class="mt-xs text-center">
<p class="font-metadata text-metadata text-outline">BPS AI dapat melakukan kesalahan. Verifikasi sumber.</p>
</div>
</div>
</div>
<!-- Floating Launcher Button -->
<button class="flex items-center gap-xs bg-brand-blue-vibrant hover:bg-primary-container text-on-primary py-sm px-md rounded-full shadow-widget transition-all transform hover:scale-105 active:scale-95" id="bps-launcher" onclick="toggleWidget()">
<span class="material-symbols-outlined fill text-[24px]">chat</span>
<span class="font-label-bold text-label-bold pr-1">Tanya BPS</span>
</button>
</div>
<script>
        function toggleWidget() {
            const widget = document.getElementById('bps-widget-container');
            const launcher = document.getElementById('bps-launcher');
            
            if (widget.style.display === 'none') {
                widget.style.display = 'flex';
                widget.style.animation = 'slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                launcher.querySelector('span:last-child').textContent = 'Tutup';
                launcher.querySelector('span:first-child').textContent = 'close';
            } else {
                widget.style.display = 'none';
                launcher.querySelector('span:last-child').textContent = 'Tanya BPS';
                launcher.querySelector('span:first-child').textContent = 'chat';
            }
        }
        
        // Auto-focus input when widget opens (simulated here)
        document.querySelector('textarea').addEventListener('focus', function() {
           this.parentElement.classList.add('bg-surface-container-lowest');
           this.parentElement.classList.remove('bg-surface-container-low');
        });
        
        document.querySelector('textarea').addEventListener('blur', function() {
           if(!this.value) {
               this.parentElement.classList.remove('bg-surface-container-lowest');
               this.parentElement.classList.add('bg-surface-container-low');
           }
        });
    </script>
</body></html>
