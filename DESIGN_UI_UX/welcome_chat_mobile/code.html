<body class="bg-bg-main text-on-surface flex flex-col h-screen overflow-hidden antialiased">
<!-- Top Navigation Bar (Mobile Simplified) -->

<div class="flex items-center gap-xs">

</button>
</div>

<!-- Welcome Hero Section -->

<!-- AI Avatar Prominent -->

<span class="material-symbols-outlined text-[36px] text-primary" data-icon="smart_toy" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Halo, ada yang bisa saya bantu?</h2>
<p class="font-body-main text-body-main text-on-surface-variant max-w-[300px]">Tanyakan informasi seputar data statistik BPS.</p>
</div>
<!-- Suggested Questions (Vertical Stack for Mobile) -->
<div class="w-full max-w-sm flex flex-col gap-sm mt-md">
<button class="flex items-start text-left gap-sm p-sm bg-surface rounded-xl border border-border-default hover:bg-surface-container-low hover:border-primary-fixed-dim transition-all active:scale-[0.98]">

</button>

                BPS AI dapat membuat kesalahan. Harap verifikasi informasi penting ke portal resmi BPS.
            </p>
</div>
</div>
<script>
        // Simple auto-resize for the textarea
        const tx = document.getElementsByTagName("textarea");
        for (let i = 0; i < tx.length; i++) {
            tx[i].setAttribute("style", "height:" + (tx[i].scrollHeight) + "px;overflow-y:hidden;");
            tx[i].addEventListener("input", OnInput, false);
        }

        function OnInput() {
            this.style.height = 0;
            this.style.height = (this.scrollHeight) + "px";
            if(this.scrollHeight > 120) {
                this.style.overflowY = "auto";
            } else {
                 this.style.overflowY = "hidden";
            }
        }
    </script>
